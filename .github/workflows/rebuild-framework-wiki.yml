name: Rebuild framework wiki

on:
  workflow_dispatch:
    inputs:
      sources_path:
        description: "Path to sources.json"
        default: "scripts/wiki_builder/sources.json"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild wiki
        run: |
          python3 scripts/wiki_builder/build_wiki.py --sources "${{ github.event.inputs.sources_path }}"

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain frameworks/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frameworks/
            git commit -m "wiki: rebuild frameworks from official docs [ci skip]"
            git push
          else
            echo "No changes to commit."
          fi

